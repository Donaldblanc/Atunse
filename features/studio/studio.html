<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Atunṣe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/styles/tokens.css">
<link rel="stylesheet" href="../../shared/styles/base.css">
<link rel="stylesheet" href="../../shared/styles/components.css">
<link rel="stylesheet" href="../../shared/styles/chrome.css">
<link rel="stylesheet" href="studio.css">
</head>
<body data-screen="studio">
<div class="shell">
  <nav class="nav">
    <a class="icb" href="../home/home.html" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="ttl">THE STUDIO</div>
    <div class="spacer"></div>
  </nav>
  <div class="pad">
    <div class="map"><div class="g"></div><div class="rd"></div><div class="rd2"></div><div class="pin"></div></div>
    <div class="studio-head">
      <div>
        <h1 class="big">Atunṣe Studio</h1>
        <p class="small" style="margin-top:6px">Manhattan, New York · 2.4 miles away</p>
      </div>
      <span class="pill green">OPEN NOW</span>
    </div>
    <div class="gap"></div>
    <div class="act">
      <button class="btn">Get directions</button>
      <button class="orb" aria-label="Call the studio"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg></button>
    </div>
    <section class="card flush">
      <div class="chead"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span><b>Hours</b></div>
      <div class="cbody" style="padding-top:6px">
        <div class="r"><span class="k">Monday – Friday</span><b>11am – 7pm</b></div>
        <div class="r"><span class="k">Saturday</span><b>12pm – 6pm</b></div>
        <div class="r" style="opacity:.45"><span class="k">Sunday</span><b>Closed</b></div>
      </div>
    </section>
    <div class="card soft" style="margin-bottom:20px">
      <p style="font-size:14px;line-height:1.55">Bring your order number or the QR code. Laces and insoles can stay in — we take them out anyway.</p>
    </div>
  </div>
</div>
<script src="../../shared/scripts/sprite.js"></script>
<script src="../../shared/scripts/screens.js"></script>
<script src="../../shared/scripts/shell.js"></script>
<script src="../../shared/scripts/interactions.js"></script>
</body>
</html>
