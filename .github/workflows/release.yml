name: Release

# Fires after a release/* or hotfix/* branch merges into main (branch-guard
# is what enforces only those can reach main). Tags the merge commit from
# package.json's version and publishes a GitHub Release. Never runs against
# a hand-crafted tag — the tag always comes from what actually merged.
on:
  push:
    branches: [main]

# Least privilege: nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag and create the GitHub Release
    steps:
      # fetch-tags: default checkout is shallow and skips tags entirely, so
      # the "does this tag already exist" check below always says no even
      # when it does — that's what caused the rejected push in the first
      # place (tried to (re)create a tag the remote already had).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from package.json
        id: version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Nothing to do
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.version }} already exists — package.json version wasn't bumped for this merge, skipping."

  back-merge-to-develop:
    needs: tag-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the back-merge branch
      pull-requests: write # open the back-merge PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open a PR to bring main's release/hotfix commits back into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without this, the merge commit below fails with "empty ident
          # name" on every run. Before PR #58 that failure was swallowed as
          # a silent no-op (exit 0) — exactly what happened for the 0.2.0
          # and 0.2.1 releases: develop never actually got backfilled.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          BRANCH="chore/back-merge-$(git rev-parse --short HEAD)"
          if git diff --quiet origin/develop main -- .; then
            echo "develop already has everything from main, nothing to back-merge."
            exit 0
          fi
          git checkout -b "$BRANCH" origin/develop
          git merge origin/main --no-edit -m "chore: back-merge main into develop after release" || {
            echo "::error::Automatic back-merge has conflicts — resolve manually: git checkout develop && git merge main, push a branch, and open the PR into develop yourself."
            exit 1
          }
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "chore: back-merge main into develop" \
            --body "Automated back-merge after a release/hotfix reached main, so develop doesn't drift behind it. Safe to merge once CI passes."

