name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege: these jobs only read the repo (vulnerability scan).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres service container (ADR-0007) — repository/migration
    # integration tests run against this, not a mock. Credentials are
    # CI-only (a throwaway container scoped to this job) but still come
    # from repo secrets rather than being hardcoded in the workflow file.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
        ports: ["5432:5432"]
        # `options` doesn't support ${{ }} expressions, so this can't
        # reference the secret username — a plain `pg_isready` still
        # correctly waits for Postgres to accept connections.
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: "package.json" # engines.node
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Integration tests (real Postgres)
        run: npm run test:integration
